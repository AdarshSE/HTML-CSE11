<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="./response.html" name="Biodata" target="_blank" method="get">
        <fieldset>
            <legend>Bio Data</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <br><br>
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" required>
            <br><br>
            <label for="dob">DOB:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="tel">Phone:</label>
            <input type="tel" id="tel" name="tel" required>
            <br><br>
            <label for="address">Adress:</label>
            <textarea id="address" name="address" rows="5" cols="30" required></textarea>
            <br><br>
            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" checked>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>
            <br><br>
            <label for="check">Vehicle u have</label>
            <input type="checkbox" id="check" name="vehicle1">
            <label for="check">Car</label>
            <input type="checkbox" id="check" name="vehicle2" checked>
            <label for="check">Bike</label>
            <br><br>
            <label for="select">Select your programming lang</label>
            <select name="select" id="select">
                <option>Select your language</option>
                <optgroup label="Programming languages">
                <option value="c">C</option>
                <option value="c++">C++</option>
                <option value="java">Java</option>
                </optgroup><optgroup label="Fronted technologies">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                </optgroup>
            </select>
            <br><br>
            <label for="url">URL</label>
            <input type="url" id="url" name="url" placeholder="Enter your website address" required>
            <br><br>
            <label for="file">File Upload</label>
            <input type="file" id="file" name="file" required>
            <br><br>
            <label for="attempt">Attempt:</label>
            <input type="number" id="attempt" name="attempt" min="1" max="10" required>
            <br><br>
            <label for="appoint">Appointment:</label>
            <input type="time" id="appoint" name="appoint" required>
            <br><br>
            <input type="submit">
            <input type="reset">
        </fieldset>
    </form>
</body>
</html>
